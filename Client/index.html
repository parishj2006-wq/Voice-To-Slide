<!DOCTYPE html>
<html>

<head>

    <title>Voice To Slide AI</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }


        .container {

            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 700px;
            margin: auto;

        }


        h1 {
            text-align: center;
        }


        input {

            margin-top: 20px;

        }


        button {

            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;

        }


        button:hover {

            background:#1d4ed8;

        }


        #result {

            margin-top:25px;

        }


        .slide {

            background:#f8fafc;
            padding:15px;
            margin-top:15px;
            border-radius:8px;

        }


        .download {

            display:inline-block;
            margin-top:20px;
            padding:12px 20px;
            background:#16a34a;
            color:white;
            text-decoration:none;
            border-radius:6px;

        }


    </style>


</head>



<body>


<div class="container">


<h1>🎤 Voice To Slide AI</h1>


<input 
type="file"
id="audioFile"
accept="audio/*"
/>


<br>


<button id="uploadButton">

Generate Presentation

</button>



<div id="result"></div>



</div>




<script>


console.log("PAGE LOADED");


// CHANGE THIS ONLY

const BACKEND_URL = "https://voice-to-slide-backend.onrender.com";



const button = document.getElementById("uploadButton");

const audioFile = document.getElementById("audioFile");

const result = document.getElementById("result");




button.onclick = async function(){



console.log("BUTTON CLICKED");



const file = audioFile.files[0];



if(!file){

    alert("Please select audio file");

    return;

}



console.log("FILE:",file);



const formData = new FormData();


formData.append(
    "audio",
    file
);



try{


result.innerHTML = 
"<h3>⏳ Uploading and Transcribing...</h3>";



// ======================
// TRANSCRIBE
// ======================


console.log("CALLING TRANSCRIBE");



const response = await fetch(

`${BACKEND_URL}/transcribe`,

{

method:"POST",

body:formData

}

);



console.log(
"TRANSCRIBE STATUS:",
response.status
);



const data = await response.json();



console.log(
"TRANSCRIBE DATA:",
data
);




if(!data.transcript){

    throw new Error(
        data.error || "No transcript received"
    );

}




result.innerHTML = `

<h2>📝 Transcript</h2>

<p>
${data.transcript}
</p>


<h3>
⏳ Generating Slides...
</h3>

`;




// ======================
// GENERATE SLIDES
// ======================



console.log("CALLING SLIDES");



const slideResponse = await fetch(

`${BACKEND_URL}/generate-slides`,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

transcript:data.transcript

})


}

);



console.log(
"SLIDE STATUS:",
slideResponse.status
);



const slideData = await slideResponse.json();



console.log(
"SLIDE DATA:",
slideData
);





let html = `


<h2>📝 Transcript</h2>

<p>
${data.transcript}
</p>


<h2>📊 Generated Slides</h2>


`;




slideData.slides.forEach(
(slide,index)=>{


html += `


<div class="slide">


<h3>
Slide ${index+1}: ${slide.title}
</h3>



<ul>


${slide.points.map(

point => `<li>${point}</li>`

).join("")}



</ul>


</div>


`;



});





html += `


<a 
class="download"
href="${slideData.downloadUrl}"
target="_blank"
download
>

⬇️ Download PowerPoint

</a>


`;



result.innerHTML = html;



}



catch(error){



console.error(
"ERROR:",
error
);



result.innerHTML = `


<h3 style="color:red">

❌ Error

</h3>


<p>

${error.message}

</p>


`;



}



};



</script>



</body>

</html>
